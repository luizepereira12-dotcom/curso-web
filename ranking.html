<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Kartaju - Ranking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo-container"><div class="logo-placeholder">LOGOTIPO KARTAJU</div></div>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="cadastro.html">Cadastro</a></li>
            <li><a href="loja.html">Loja</a></li>
            <li><a href="carrinho.html">Carrinho</a></li>
            <li><a href="trofeus.html">Galeria de Troféus</a></li>
            <li><a href="ranking.html" class="active">Ranking</a></li>
            <li><a href="carros.html">Galeria de Karts</a></li>
        </ul>
    </div>
    <div class="main-content">
        <header><h1>Ranking Geral</h1></header>
        <h2>Pilotos</h2><br>
        <table>
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Piloto</th>
                    <th>Equipe</th>
                    <th>Pontos</th>
                </tr>
            </thead>
            <!-- Adicionado id="tabela-ranking" no tbody -->
            <tbody id="tabela-ranking">
                <tr><td>1º</td><td>Carlos Silva</td><td>Kartaju Red Racing</td><td>120</td></tr>
                <tr><td>2º</td><td>Marcos Souza</td><td>Sergipe Speed</td><td>105</td></tr>
            </tbody>
        </table>
    </div>

    <!-- SCRIPT ADICIONADO PARA CARREGAR OS PILOTOS CADASTRADOS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tbody = document.getElementById('tabela-ranking');
            
            // Busca a lista de pilotos do localStorage
            const pilotosCadastrados = JSON.parse(localStorage.getItem('pilotos')) || [];

            // Define a posição inicial com base nos pilotos já existentes estaticamente (2 linhas padrão + 1)
            let posicaoAtual = tbody.getElementsByTagName('tr').length + 1;

            // Insere cada novo piloto na tabela do ranking
            pilotosCadastrados.forEach(piloto => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${posicaoAtual}º</td>
                    <td>${piloto.nome}</td>
                    <td>${piloto.equipe}</td>
                    <td>${piloto.pontos}</td>
                `;
                tbody.appendChild(tr);
                posicaoAtual++;
            });
        });
    </script>
</body>
</html>
